name: SAS LEVEL TRACKER Bot

on:
  # മാർക്കറ്റ് ദിവസങ്ങളിൽ (തിങ്കൾ മുതൽ വെള്ളി വരെ) രാവിലെ 9:00 മുതൽ വൈകുന്നേരം 3:40 വരെ
  # UTC ടൈം സോൺ അനുസരിച്ചാണ് ക്രോൺ (Cron) പ്രവർത്തിക്കുന്നത് (IST-യിൽ നിന്ന് 5.5 മണിക്കൂർ കുറവാണ്).
  # 9:00 AM IST = 3:30 AM UTC | 3:40 PM IST = 10:10 PM UTC
  schedule:
    - cron: '30-40/3 3-10 * * 1-5'  # തിങ്കൾ മുതൽ വെള്ളി വരെ દર 3 മിനിറ്റിലും റൺ ചെയ്യും

  # മാന്വൽ ആയി റൺ ചെയ്യാനുള്ള ഓപ്ഷൻ
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scalping Bot
      run: |
        python bot.py  # നിങ്ങളുടെ പൈത്തൺ ഫയലിന്റെ പേര് ഇവിടെ നൽകുക (ഉദാഹരണത്തിന് main.py ആണെങ്കിൽ അങ്ങനെ മാറ്റുക)
