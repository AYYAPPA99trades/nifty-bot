name: Nifty Trading Bot

on:
  schedule:
    - cron: '25 3 * * 1-5' # 08:55 AM IST (9 മണിക്ക് മുൻപ് കൃത്യമായി സ്റ്റാർട്ട് ആകും)
    - cron: '0 7 * * 1-5'  # 12:30 PM IST (Backup trigger)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        run: python main.py
