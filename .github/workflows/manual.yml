name: Nifty Pro Multi-Scanner

on:
  schedule:
    # 03:30 UTC = 09:00 AM IST മുതൽ 10:20 UTC = 03:50 PM IST വരെ
    - cron: '30,45 3 * * 1-5'
    - cron: '0,15,30,45 4-9 * * 1-5'
    - cron: '0,15,30,45,50 10 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests pytz

      - name: Run Master Engine
        run: |
          python master_engine.py
