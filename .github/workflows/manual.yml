name: Nifty Pro Multi-Bot Scanner

on:
  schedule:
    # 03:38 UTC = 09:08 AM IST (Pre-market Alert)
    - cron: '38 3 * * 1-5'
    # 04:00 - 09:45 UTC = 09:30 AM - 03:15 PM IST (Live Trading Scan every 15 mins)
    - cron: '0,15,30,45 4-9 * * 1-5'
    # 10:15 UTC = 03:45 PM IST (Post-market Daily Summary & Expiry Check)
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-algo-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Strategy Bot
        env:
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_CHAT_ID_1: ${{ secrets.TELEGRAM_CHAT_ID_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          python master_bot.py

      - name: Save Trade State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_state.json || true
          git commit -m "Auto-update trade state [skip ci]" || true
          git push || true
