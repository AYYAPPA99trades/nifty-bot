name: SAS LEVEL TRACKER Continuous Engine

on:
  schedule:
    # Monday to Friday at UTC 03:25 AM (IST 08:55 AM)
    - cron: '25 3 * * 1-5'
  workflow_dispatch:

jobs:
  run-scalper:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Previous Trade State
        uses: actions/cache@v4
        with:
          path: |
            trade_state.json
            trade_history.json
          key: trade-state-${{ github.run_id }}
          restore-keys: |
            trade-state-

      - name: Run Trading System
        run: python scalper.py
