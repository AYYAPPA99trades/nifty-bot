jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy ta reportlab requests pytz

      - name: Run Trading Bot
        run: python scalper.py   # <-- ഇവിടെ നിങ്ങളുടെ പൈത്തൺ ഫയലിന്റെ കൃത്യമായ പേര് കൊടുക്കുക
        env:
          TZ: Asia/Kolkata
