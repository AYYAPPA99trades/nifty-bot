name: SAS LEVEL TRACKER Continuous Engine

on:
  schedule:
    # Monday to Friday at UTC 03:55 AM (IST 09:25 AM)
    - cron: '55 3 * * 1-5'
  workflow_dispatch:

# Git write & workflow permissions set cheyyan
permissions:
  contents: write
  actions: write

jobs:
  run-scalper:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Previous Trade State
        uses: actions/cache@v4
        with:
          path: |
            trade_state.json
            trade_history.json
          key: trade-state-${{ github.run_id }}
          restore-keys: |
            trade-state-

      - name: Run Trading System
        run: python scalper.py

      - name: Commit & Save State Logs
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_state.json trade_history.json || true
          git commit -m "Auto-save trade state & history [skip ci]" || true
          git push || true
